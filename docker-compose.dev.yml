services:
  dev:
    container_name: quizer-dev
    image: quizer-api
    env_file:
      - ./.envs/.local/.env
      - ./.envs/.utils/.env
      - ./.envs/.db/.env
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile-dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules   # <-- use named volume
    ports:
      - "8000:8000"
      - "9229:9229"
    restart: unless-stopped
    networks:
      - quiz_api

volumes:
  node_modules:   # <-- declare named volume here

networks:
  quiz_api: